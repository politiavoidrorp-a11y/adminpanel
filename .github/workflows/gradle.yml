name: Build KELPMC Admin Panel

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build plugin
        run: gradle build

      - name: Upload plugin JAR
        uses: actions/upload-artifact@v4
        with:
          name: KELPMC-AdminPanel
          path: build/libs/*.jar
